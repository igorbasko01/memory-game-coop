# The game's Cloudflare Worker: serves the web app and the online server (/api/*)
# at https://memory.baskorp.com.
# Deployed by .github/workflows/deploy.yml, which builds webapp/dist first.
name = "memory-coop"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# The game's own address. Cloudflare creates the DNS record and certificate.
routes = [{ pattern = "memory.baskorp.com", custom_domain = true }]

# The built web app. Only /api/* runs the Worker; everything else is a static file.
[assets]
directory = "../webapp/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "memory-coop"
database_id = "97a71fde-5387-48b8-a3ed-771683f9e6f3"
migrations_dir = "migrations"

[observability]
enabled = true
